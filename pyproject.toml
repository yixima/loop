[project]
name = "loop-engineering-env"
version = "0.1.0"
description = "ループエンジニアリングを試すための開発環境"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
mypy_path = "src"
python_version = "3.10"
ignore_missing_imports = true
